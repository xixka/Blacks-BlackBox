name: CI Build

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Accept Android SDK licenses & install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Refresh lint baseline (auditable, committed to repo)
        run: ./gradlew :app:updateLintBaseline --stacktrace --no-daemon

      - name: Android Lint (app + Bcore)
        run: ./gradlew :app:lintDebug :Bcore:lintDebug --stacktrace --no-daemon

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
            **/lint-baseline.xml
          if-no-files-found: ignore

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Publish APK to Releases (dev, overwrite)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apk

      - name: Keep universal APK only
        run: |
          cd apk
          ls -la
          # ABI splits produce: universal (no abi suffix) + arm64-v8a + armeabi-v7a.
          # Publish only the universal APK so the release has a single install-anywhere file.
          UNIVERSAL=$(ls *.apk | grep -vE 'arm64-v8a|armeabi-v7a|x86|x86_64' | head -1)
          echo "universal apk: $UNIVERSAL"
          # delete ABI-specific APKs, keep only the universal one
          rm -f *arm64-v8a*.apk *armeabi-v7a*.apk *x86*.apk
          mv -f "$UNIVERSAL" "Blacks-BlackBox-dev.apk"
          ls -la

      - name: Overwrite dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev Build
          target_commitish: main
          files: apk/*.apk
          prerelease: true
          generate_release_notes: true
          body: |
            自动构建的开发版 APK（tag `dev`，每次推送 main 自动覆盖更新）。

            - 构建提交：${{ github.sha }}
            - 包含元萝卜（Meta Wolf）备份导入功能的全部代码

  instrumented-tests:
    name: Instrumented Tests (emulator API 34)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses & install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build instrumented test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: '**/build/reports/androidTests/'
          if-no-files-found: ignore
